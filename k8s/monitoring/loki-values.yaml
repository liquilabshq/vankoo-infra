# Logs centralizados (chart grafana/loki, versión fijada en scripts/aks/aks-platform.sh).
# Loki guarda los logs de todos los pods que le envía Alloy (alloy-values.yaml) y
# Grafana los consulta con LogQL. Versión ligera para el clúster de 3 nodos de 8 GB:
#   - Un solo proceso (SingleBinary) con el almacenamiento en el disco del propio
#     pod (emptyDir): cada nodo de AKS admite solo 4 discos y las bases ya los usan.
#     Si el pod se reinicia, se pierde el historial (igual que en Prometheus).
#   - Retención de 48 h, sin cachés memcached, sin gateway nginx y sin canary.
#   - El ruler evalúa las alertas basadas en logs (vankoo/loki-rules.yaml) y las
#     manda al mismo Alertmanager que Prometheus.
deploymentMode: SingleBinary

loki:
  # Un solo inquilino: Alloy y Grafana no mandan la cabecera X-Scope-OrgID.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 48h
    reject_old_samples: true
    reject_old_samples_max_age: 48h
    volume_enabled: true
    # Permite que Grafana lea los metadatos estructurados (trace_id) que pone Alloy.
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  rulerConfig:
    storage:
      type: local
      local:
        # El sidecar copia aquí las reglas de los ConfigMaps con la etiqueta
        # loki_rule; «fake» es el inquilino por defecto sin auth_enabled.
        directory: /rules
    rule_path: /var/loki/ruler-scratch
    alertmanager_url: http://monitoring-kube-prometheus-alertmanager.monitoring:9093
    enable_api: true
    enable_alertmanager_v2: true
  # Sin la ruta /loki/api/v1/push expuesta fuera del clúster: solo el Service interno.
  ui:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  extraVolumes:
    - name: data
      emptyDir:
        sizeLimit: 4Gi
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}

# Reglas de alerta de logs desde ConfigMaps (k8s/monitoring/vankoo/loki-rules.yaml).
sidecar:
  rules:
    enabled: true
    label: loki_rule
    folder: /rules/fake
    searchNamespace: [monitoring]
  resources:
    requests: {cpu: 5m, memory: 32Mi}
    limits: {memory: 64Mi}

# Componentes del modo distribuido y extras que no se usan en SingleBinary.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomPlanner: {replicas: 0}
bloomBuilder: {replicas: 0}
bloomGateway: {replicas: 0}
ruler:
  enabled: true
  replicas: 0
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
