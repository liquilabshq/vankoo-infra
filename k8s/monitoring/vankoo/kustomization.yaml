# Monitoreo propio de Vankoo sobre kube-prometheus-stack (namespace monitoring).
# Lo aplica scripts/aks/aks-platform.sh después de instalar el chart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - service-monitor.yaml
  - rules.yaml
configMapGenerator:
  - name: vankoo-dashboard
    files:
      - vankoo-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
