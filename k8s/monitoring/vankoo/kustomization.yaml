# Monitoreo propio de Vankoo sobre la plataforma de observabilidad (namespace
# monitoring). Lo aplica scripts/aks/aks-platform.sh después de instalar los charts
# (el recurso Instrumentation necesita los CRD del OpenTelemetry Operator).
#   service-monitor.yaml   Prometheus raspa las métricas del API Gateway
#   rules.yaml             SLI/SLO, burn rate y alertas (Prometheus)
#   loki-rules.yaml        alertas basadas en logs (ruler de Loki)
#   instrumentation.yaml   cómo se inyectan los agentes de trazas en los servicios
#   *-dashboard.json       dashboards de Grafana (carpeta General)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - service-monitor.yaml
  - rules.yaml
  - instrumentation.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: vankoo-dashboard
    files:
      - vankoo-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: vankoo-slo-dashboard
    files:
      - vankoo-slo-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: vankoo-logs-dashboard
    files:
      - vankoo-logs-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: vankoo-traces-dashboard
    files:
      - vankoo-traces-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: vankoo-loki-rules
    files:
      - loki-rules.yaml
    options:
      labels:
        loki_rule: "1"
