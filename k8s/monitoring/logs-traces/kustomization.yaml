# Capa de logs centralizados y trazas distribuidas sobre la plataforma de monitoreo
# (namespace monitoring). NO está activada en AKS: el clúster no tiene memoria libre
# (un nodo ya va al 100 %) y la cuota de Azure for Students (6 vCPU) no admite otro
# nodo. Ver k8s/README.md → Monitoreo.
#
# La aplica scripts/aks/aks-platform.sh --logs-traces después de instalar sus charts
# (el recurso Instrumentation necesita los CRD del OpenTelemetry Operator):
#   loki-values.yaml, alloy-values.yaml        logs: Loki y su recolector Alloy
#   tempo-values.yaml, otel-operator-values.yaml  trazas: Tempo y el operador de agentes
#   kube-prometheus-stack-values.yaml          fuentes Loki y Tempo en Grafana, remote write
#   instrumentation.yaml                       cómo se inyectan los agentes en los servicios
#   rules.yaml                                 latencia p95 por flujo y salud de la capa
#   loki-rules.yaml                            alertas basadas en logs (ruler de Loki)
#   *-dashboard.json                           dashboards «Vankoo · Logs» y «Vankoo · Trazas»
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - instrumentation.yaml
  - rules.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: vankoo-logs-dashboard
    files:
      - vankoo-logs-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: vankoo-traces-dashboard
    files:
      - vankoo-traces-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: vankoo-loki-rules
    files:
      - loki-rules.yaml
    options:
      labels:
        loki_rule: "1"
