# Además del gateway (base), en Azure reciben tráfico del Ingress:
#   - la web MYPE, que se sirve desde el mismo origen;
#   - Finance, solo por el webhook de Stripe, que no pasa por el gateway porque
#     Stripe no manda JWT (el Ingress solo expone esa ruta, ver patches/ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mype-web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-webhook-from-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finance-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# Prometheus (namespace monitoring) recoge las métricas del gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# cert-manager crea un pod temporal que responde al reto HTTP-01 de Let's Encrypt
# en /.well-known/acme-challenge/ (por el Ingress) cada vez que pide o renueva el
# certificado.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver-from-ingress
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
