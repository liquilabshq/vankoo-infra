# Web MYPE (vankoo-mype-web): SPA compilada servida por nginx sin privilegios.
# Comparte origen con el API (ver patches/ingress.yaml), así que no necesita CORS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mype-web
  labels:
    app.kubernetes.io/name: mype-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mype-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mype-web
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mype-web
          image: vankoo-mype-web
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mype-web
  labels:
    app.kubernetes.io/name: mype-web
spec:
  selector:
    app.kubernetes.io/name: mype-web
  ports:
    - name: http
      port: 80
      targetPort: http
