# Una ServiceAccount por workload, sin token de la API de Kubernetes.
#
# Ningún servicio de Vankoo llama a la API de Kubernetes (descubren a los demás con
# Eureka y leen su configuración de variables de entorno). Por eso cada pod corre
# con su propia identidad y sin el token montado en
# /var/run/secrets/kubernetes.io/serviceaccount: si alguien compromete un
# contenedor, no encuentra credenciales para hablar con el clúster.
#
# Ninguna de estas cuentas tiene Role ni RoleBinding, así que tampoco tendrían
# permisos aunque se montara el token. La `default` del namespace se deja igual de
# cerrada, para que un pod nuevo que no declare su cuenta no reciba token.
#
# Los permisos de las personas dentro del namespace están en roles.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
automountServiceAccountToken: false
---
