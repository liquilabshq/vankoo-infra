apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  labels:
    app.kubernetes.io/name: risk-service
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-service
        app.kubernetes.io/component: microservice
    spec:
      # Identidad propia y sin token de la API: el servicio no habla con Kubernetes
      # (ver k8s/base/rbac/service-accounts.yaml).
      serviceAccountName: risk-service
      automountServiceAccountToken: false
      # Cada imagen ya fija su usuario sin privilegios (USER en el Dockerfile). No se
      # declara runAsNonRoot porque varias usan un usuario con nombre (spring, risk)
      # y Kubernetes solo puede comprobarlo con un UID numérico.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: risk-service
          image: vankoo-risk-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: RISK_DATABASE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-broker:9094"
            - name: KAFKA_GROUP_ID
              value: "risk-auction-assessment-v1"
            - name: KYC_PROFILE_GROUP_ID
              value: "risk-profile-verification-v1"
            - name: KAFKA_AUTO_OFFSET_RESET
              value: "latest"
            - name: INVESTMENT_BASE_URL
              value: "http://investment-service:8082"
            - name: GREEN_DOCUMENTS_BASE_URL
              value: "http://minio:9000/vankoo-profile-documents"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: OPENAI_API_KEY
            - name: NEWS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: RISK_AI_ENABLED
            - name: GREEN_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: RISK_AI_ENABLED
            - name: REGISTRY_REFRESH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: RISK_REGISTRY_REFRESH_ENABLED
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
  labels:
    app.kubernetes.io/name: risk-service
spec:
  selector:
    app.kubernetes.io/name: risk-service
  ports:
    - name: http
      port: 8000
      targetPort: http
