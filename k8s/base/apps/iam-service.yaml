apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-service
  labels:
    app.kubernetes.io/name: iam-service
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iam-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam-service
        app.kubernetes.io/component: microservice
    spec:
      # Cada imagen ya fija su usuario sin privilegios (USER en el Dockerfile). No se
      # declara runAsNonRoot porque varias usan un usuario con nombre (spring, risk)
      # y Kubernetes solo puede comprobarlo con un UID numérico.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iam-service
          image: vankoo-iam-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DISCOVERY_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: DISCOVERY_SERVER_URL
            - name: API_GATEWAY_PORT
              value: "8080"
            - name: IAM_SERVICE_HOST
              value: "iam-service"
            - name: IAM_DB_HOST
              value: "iam-db-postgres"
            - name: IAM_DB_PORT
              value: "5432"
            - name: IAM_DB_NAME
              value: "vankoo_iam_db"
            - name: IAM_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: IAM_DB_USERNAME
            - name: IAM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: IAM_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_DAYS
              value: "7"
            - name: KAFKA_HOST
              value: "kafka-broker"
            - name: KAFKA_INTERNAL_PORT
              value: "9094"
            - name: MAIL_HOST
              value: "mailpit"
            - name: MAIL_PORT
              value: "1025"
            - name: MAIL_FROM
              value: "Vankoo <no-reply@vankoo.dev>"
            - name: PASSWORD_RESET_EXPIRATION_MINUTES
              value: "30"
            - name: PASSWORD_RESET_WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: PASSWORD_RESET_WEB_URL
            - name: PASSWORD_RESET_MOBILE_URL
              value: "vankoo://reset-password"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: iam-service
  labels:
    app.kubernetes.io/name: iam-service
spec:
  selector:
    app.kubernetes.io/name: iam-service
  ports:
    - name: http
      port: 8081
      targetPort: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iam-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iam-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
