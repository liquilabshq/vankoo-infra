apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  labels:
    app.kubernetes.io/name: profile-service
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: profile-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profile-service
        app.kubernetes.io/component: microservice
    spec:
      # Identidad propia y sin token de la API: el servicio no habla con Kubernetes
      # (ver k8s/base/rbac/service-accounts.yaml).
      serviceAccountName: profile-service
      automountServiceAccountToken: false
      # Cada imagen ya fija su usuario sin privilegios (USER en el Dockerfile). No se
      # declara runAsNonRoot porque varias usan un usuario con nombre (spring, risk)
      # y Kubernetes solo puede comprobarlo con un UID numérico.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: profile-service
          image: vankoo-profile-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: EUREKA_HOST
              value: "discovery-server"
            - name: EUREKA_PORT
              value: "8761"
            - name: INSTANCE_HOSTNAME
              value: "profile-service"
            - name: KAFKA_BROKERS
              value: "kafka-broker:9094"
            - name: PROFILE_DB_HOST
              value: "profile-db-postgres"
            - name: PROFILE_DB_PORT
              value: "5432"
            - name: PROFILE_DB_NAME
              value: "vankoo_profile_db"
            - name: PROFILE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: PROFILE_DB_USER
            - name: PROFILE_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: PROFILE_DB_PASSWORD
            - name: STORAGE_PROVIDER
              value: "minio"
            - name: MINIO_ENDPOINT
              value: "minio"
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: MINIO_PUBLIC_URL
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  labels:
    app.kubernetes.io/name: profile-service
spec:
  selector:
    app.kubernetes.io/name: profile-service
  ports:
    - name: http
      port: 3000
      targetPort: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: profile-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: profile-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
