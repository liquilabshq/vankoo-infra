apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service
  labels:
    app.kubernetes.io/name: finance-service
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finance-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance-service
        app.kubernetes.io/component: microservice
    spec:
      # Identidad propia y sin token de la API: el servicio no habla con Kubernetes
      # (ver k8s/base/rbac/service-accounts.yaml).
      serviceAccountName: finance-service
      automountServiceAccountToken: false
      # Cada imagen ya fija su usuario sin privilegios (USER en el Dockerfile). No se
      # declara runAsNonRoot porque varias usan un usuario con nombre (spring, risk)
      # y Kubernetes solo puede comprobarlo con un UID numérico.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finance-service
          image: vankoo-finance-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: DISCOVERY_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: DISCOVERY_SERVER_URL
            - name: API_GATEWAY_PORT
              value: "8080"
            - name: FINANCE_SERVICE_HOST
              value: "finance-service"
            - name: AXON_SERVER_HOST
              value: "axon-server"
            - name: AXON_SERVER_PORT
              value: "8124"
            - name: FINANCE_DB_HOST
              value: "finance-db-postgres"
            - name: FINANCE_DB_PORT
              value: "5432"
            - name: FINANCE_DB_NAME
              value: "vankoo_finance_db"
            - name: FINANCE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: FINANCE_DB_USERNAME
            - name: FINANCE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: FINANCE_DB_PASSWORD
            - name: KAFKA_HOST
              value: "kafka-broker"
            - name: KAFKA_INTERNAL_PORT
              value: "9094"
            - name: STRIPE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: STRIPE_ENABLED
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_SUCCESS_URL
              value: "vankoo://deposits/success"
            - name: STRIPE_CANCEL_URL
              value: "vankoo://deposits/cancel"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: finance-service
  labels:
    app.kubernetes.io/name: finance-service
spec:
  selector:
    app.kubernetes.io/name: finance-service
  ports:
    - name: http
      port: 8083
      targetPort: http
