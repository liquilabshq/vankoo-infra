apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoicing-service
  labels:
    app.kubernetes.io/name: invoicing-service
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: invoicing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoicing-service
        app.kubernetes.io/component: microservice
    spec:
      # Cada imagen ya fija su usuario sin privilegios (USER en el Dockerfile). No se
      # declara runAsNonRoot porque varias usan un usuario con nombre (spring, risk)
      # y Kubernetes solo puede comprobarlo con un UID numérico.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: invoicing-service
          image: vankoo-invoicing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: DbSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: INVOICING_DB_CONNECTION_STRING
            - name: DbSettings__DatabaseName
              value: "vankoo_invoicing_db"
            - name: TokenSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: JWT_SECRET
            - name: AzureOcrSettings__Endpoint
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: AZURE_OCR_ENDPOINT
            - name: AzureOcrSettings__ApiKey
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: AZURE_OCR_API_KEY
            - name: KafkaSettings__ProfileKycGroupId
              value: "invoicing-profile-kyc-v1"
            - name: KafkaSettings__ProfileKycAutoOffsetReset
              value: "Earliest"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: invoicing-service
  labels:
    app.kubernetes.io/name: invoicing-service
spec:
  selector:
    app.kubernetes.io/name: invoicing-service
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: invoicing-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: invoicing-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
