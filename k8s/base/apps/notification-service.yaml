apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: microservice
    spec:
      # Identidad propia y sin token de la API: el servicio no habla con Kubernetes
      # (ver k8s/base/rbac/service-accounts.yaml).
      serviceAccountName: notification-service
      automountServiceAccountToken: false
      # Cada imagen ya fija su usuario sin privilegios (USER en el Dockerfile). No se
      # declara runAsNonRoot porque varias usan un usuario con nombre (spring, risk)
      # y Kubernetes solo puede comprobarlo con un UID numérico.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: vankoo-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: EUREKA_HOST
              value: "discovery-server"
            - name: EUREKA_PORT
              value: "8761"
            - name: INSTANCE_HOSTNAME
              value: "notification-service"
            - name: KAFKA_BROKERS
              value: "kafka-broker:9094"
            - name: KAFKA_GROUP_ID
              value: "notification-delivery-v1"
            - name: EMAIL_PROVIDER
              value: "smtp"
            - name: SMTP_HOST
              value: "mailpit"
            - name: SMTP_PORT
              value: "1025"
            - name: MAIL_FROM
              value: "Vankoo <no-reply@vankoo.dev>"
            - name: PUSH_PROVIDER
              value: "logging"
            - name: PUSH_TOPIC_SECRET
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: PUSH_TOPIC_SECRET
            - name: WEB_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: WEB_APP_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 3001
      targetPort: http
