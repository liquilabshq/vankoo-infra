apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-service
  labels:
    app.kubernetes.io/name: investment-service
    app.kubernetes.io/component: microservice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: investment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-service
        app.kubernetes.io/component: microservice
    spec:
      # Cada imagen ya fija su usuario sin privilegios (USER en el Dockerfile). No se
      # declara runAsNonRoot porque varias usan un usuario con nombre (spring, risk)
      # y Kubernetes solo puede comprobarlo con un UID numérico.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: investment-service
          image: vankoo-investment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: DISCOVERY_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: vankoo-config
                  key: DISCOVERY_SERVER_URL
            - name: INVESTMENT_SERVICE_HOST
              value: "investment-service"
            - name: INVESTMENT_DB_HOST
              value: "investment-db-oracle"
            - name: INVESTMENT_DB_PORT
              value: "1521"
            - name: INVESTMENT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: INVESTMENT_DB_USER
            - name: INVESTMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: INVESTMENT_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_DAYS
              value: "7"
            - name: KAFKA_HOST
              value: "kafka-broker"
            - name: KAFKA_INTERNAL_PORT
              value: "9094"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: investment-service
  labels:
    app.kubernetes.io/name: investment-service
spec:
  selector:
    app.kubernetes.io/name: investment-service
  ports:
    - name: http
      port: 8082
      targetPort: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: investment-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: investment-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
