apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: invoicing-db-mongo
  labels:
    app.kubernetes.io/name: invoicing-db-mongo
    app.kubernetes.io/component: data
spec:
  serviceName: invoicing-db-mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: invoicing-db-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoicing-db-mongo
        app.kubernetes.io/component: data
    spec:
      containers:
        - name: invoicing-db-mongo
          image: mongo:7.0
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: "vankoo_invoicing_db"
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: INVOICING_DB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vankoo-secrets
                  key: INVOICING_DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand(\"ping\")"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: invoicing-db-mongo
  labels:
    app.kubernetes.io/name: invoicing-db-mongo
spec:
  # Permite que el propio pod se alcance por su Service antes de estar listo
  # (Kafka en modo KRaft habla con su controlador por kafka-broker:9093).
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: invoicing-db-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
