# cert-manager (chart jetstack/cert-manager, versión fijada en scripts/aks/aks-platform.sh):
# pide y renueva solo el certificado TLS de Let's Encrypt del Ingress de Vankoo.
crds:
  enabled: true
resources:
  requests: {cpu: 10m, memory: 48Mi}
  limits: {memory: 128Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 64Mi}
cainjector:
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}
