name: vankoo  # Este será el prefijo para redes, volúmenes y contenedores

services:
  # --- Profile Service ----
  profile-service:
    build:
      context: ../vankoo-profile-service
      dockerfile: Dockerfile
    hostname: profile-service
    networks:
      - main-network
    ports:
      - "${PROFILE_SERVICE_PORT:-3000}:3000"
    environment:
      # Base de datos
      PROFILE_DB_HOST: profile-db-postgres
      PROFILE_DB_PORT: 5432 # Puerto interno de Docker
      PROFILE_DB_NAME: ${PROFILE_DB_NAME:-vankoo_profile_db_dev}
      PROFILE_DB_USER: ${PROFILE_DB_USER:-admin}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:-password}
      # Kafka
      KAFKA_BROKERS: kafka-broker:9094
      # Almacenamiento de archivos (MinIO en local; STORAGE_PROVIDER=s3 activa Amazon S3)
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio # Dirección interna de Docker, usada por el backend para hablar con MinIO
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # URL pública real (puerto expuesto al host) para que el fileUrl devuelto sea abrible desde tu navegador
      MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT:-9100}/${MINIO_BUCKET_NAME:-vankoo-profile-documents}
      # Discovery Server (Eureka)
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      INSTANCE_HOSTNAME: profile-service
    depends_on:
      profile-db-postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped

  profile-db-postgres:
    image: postgres:15
    networks:
      - main-network
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PROFILE_DB_NAME:-vankoo_profile_db_dev}
      POSTGRES_USER: ${PROFILE_DB_USER:-admin}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:-password}
    ports:
      - "${PROFILE_DB_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- IAM Service ---
  iam-service:
    build:
      context: ../vankoo-iam-service
      dockerfile: Dockerfile
    hostname: iam-service
    networks:
      - main-network
    # En producción, no se debería exponer el puerto del IAM directamente al exterior, pero para desarrollo es útil para hacer pruebas manuales con Postman o el navegador.
    # En producción, se accedería a través del API Gateway.
    ports:
      - "${IAM_SERVICE_PORT:-8081}:8081" # El puerto de la izquierda es el de tu PC, el de la derecha es el del contenedor
    environment:
      IAM_SERVICE_HOST: ${IAM_SERVICE_HOST:-iam-service}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_DAYS: ${JWT_EXPIRATION_DAYS}
      IAM_DB_HOST: ${IAM_DB_HOST:-iam-db-postgres} # Usamos el nombre del servicio de la base de datos como hostname para la conexión
      IAM_DB_PORT: ${IAM_DB_PORT:-5432} # Puerto de la base de datos, configurable a través de variable de entorno o 5432 por defecto
      IAM_DB_NAME: ${IAM_DB_NAME:-vankoo_iam_db_dev} # Nombre de la base de datos, configurable a través de variable de entorno o 'vankoo_iam_db_dev' por defecto
      IAM_DB_USERNAME: ${IAM_DB_USERNAME:-admin} # Usuario para la base de datos, configurable a través de variable de entorno o 'admin' por defecto
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:-password} # Contraseña para la base de datos, configurable a través de variable de entorno o 'password' por defecto
      IAM_DOCUMENTATION_SERVER_URL: ${IAM_DOCUMENTATION_SERVER_URL:-localhost} # URL para el servidor de documentación, configurable a través de variable de entorno o 'localhost' por defecto
      IAM_DOCUMENTATION_GATEWAY_URL: ${IAM_DOCUMENTATION_GATEWAY_URL:-localhost} # URL para el API Gateway en la documentación, configurable a través de variable de entorno o 'localhost' por defecto
      KAFKA_HOST: ${KAFKA_HOST:-kafka-broker}
      KAFKA_INTERNAL_PORT: ${KAFKA_INTERNAL_PORT:-9094}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL:-http://discovery-server:8761/eureka/}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-8080} # Usada principalmente para la URL de la documentación de OpenAPI
      # Correo saliente. En local apunta a Mailpit; en producción, a un relay de verdad.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-Vankoo <no-reply@vankoo.dev>}
      # A dónde apunta el enlace de recuperar contraseña. El de la web lo abre un
      # navegador en tu máquina, no dentro de la red de Docker, así que es localhost.
      PASSWORD_RESET_WEB_URL: ${PASSWORD_RESET_WEB_URL:-http://localhost:5173/iam/reset}
      PASSWORD_RESET_MOBILE_URL: ${PASSWORD_RESET_MOBILE_URL:-vankoo://reset-password}
      PASSWORD_RESET_EXPIRATION_MINUTES: ${PASSWORD_RESET_EXPIRATION_MINUTES:-30}
    depends_on:
      iam-db-postgres:
        condition: service_healthy # Espera a que la DB esté lista para recibir queries
      kafka-broker:
        condition: service_healthy # Espera a que el broker acepte mensajes
      discovery-server:
        condition: service_healthy # Espera a que Eureka esté listo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s # El IAM tarda un poco más en conectar a DB y Kafka
    restart: unless-stopped

  # --- Invoicing Service ---
  invoicing-service:
    build:
      context: ../vankoo-invoicing-service
      dockerfile: LiquiLabs.Vankoo.Invoicing/Dockerfile
    hostname: invoicing-service
    networks:
      - main-network

    # En producción, normalmente no se expone este puerto directamente.
    # Para desarrollo lo dejamos publicado para pruebas manuales (Postman, navegador, etc.).
    # En escenarios productivos, el acceso debería ser a través del API Gateway.
    ports:
      # El puerto de la izquierda es el host port (debe ser única, sino docker fallará
      # con address already in use), el de la derecha es el container port (puede
      # repetirse sin problema, ya que es interno de cada contenedor).
      # 5132 es el puerto que el propio servicio declara en su launchSettings.json, que
      # es donde corre cuando se levanta fuera de Docker. No puede publicar el 8080 que
      # usa por dentro —ese es el del gateway— así que usa el suyo de .NET y deja el
      # bloque 808x entero para los servicios de Spring.
      - "${INVOICING_SERVICE_PORT:-5132}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker # Fuerza configuración de entorno Docker
      ASPNETCORE_HTTP_PORTS: 8080 # Puerto HTTP interno en el que escucha la app dentro del contenedor
      TokenSettings__Secret: ${JWT_SECRET} # Se reutiliza el secreto JWT compartido entre servicios
      AzureOcrSettings__ApiKey: ${AZURE_OCR_API_KEY} # API Key del servicio OCR de Azure
      AzureOcrSettings__Endpoint: ${AZURE_OCR_ENDPOINT} # Endpoint del servicio OCR de Azure
      DbSettings__ConnectionString: mongodb://${INVOICING_DB_USER:-admin}:${INVOICING_DB_PASSWORD:-password}@invoicing-db-mongo:${INVOICING_DB_PORT:-27017}/?authSource=admin # Conexión a Mongo usando el nombre del servicio como hostname
      DbSettings__DatabaseName: ${INVOICING_DB_NAME:-vankoo_invoicing_db_dev} # Nombre de la base de datos de facturación
    depends_on:
      invoicing-db-mongo:
        condition: service_started # Espera al arranque del contenedor de Mongo
      kafka-broker:
        condition: service_healthy # Espera a que Kafka esté operativo
      discovery-server:
        condition: service_healthy # Espera a que Eureka esté listo para registro/descubrimiento
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"] # Verifica readiness real del servicio .NET
      interval: 30s # Frecuencia de verificación
      timeout: 10s # Tiempo máximo de espera por intento
      retries: 3 # Intentos antes de marcar como unhealthy
      start_period: 40s # Margen inicial para permitir arranque de la app y dependencias
    restart: unless-stopped # Reinicia automáticamente salvo que se detenga manualmente


  # --- IAM Database (PostgreSQL) ---
  iam-db-postgres:
    image: postgres:15 # Versión 15 estable
    networks: # Sirve para conectar este servicio con otros dentro de la misma red, permitiendo que se comuniquen entre sí usando los nombres de servicio como hostnames
      - main-network
    volumes:
      - iam-db-data:/var/lib/postgresql/data # La izquierda significa el nombre del volumen, la derecha es la ruta dentro del contenedor donde se almacenan los datos de Postgres
    environment:
      POSTGRES_DB: ${IAM_DB_NAME:-vankoo_iam_db_dev}
      POSTGRES_USER: ${IAM_DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:-password} # Usa variable o 'password' por defecto
    ports:
      - "${IAM_DB_PORT:-5432}:5432"
    healthcheck:
      # Toma las variables de entorno definidas DENTRO del contenedor (con doble $ para escapar) para ejecutar el comando de verificación de estado de Postgres
      # Es decir, toma los valores de POSTGRES_USER y POSTGRES_DB que definimos en environment para construir el comando pg_isready
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  invoicing-db-mongo:
    image: mongo:7.0
    networks:
      - main-network
    volumes:
      - invoicing-db-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${INVOICING_DB_NAME:-vankoo_invoicing_db_dev}
      MONGO_INITDB_ROOT_USERNAME: ${INVOICING_DB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${INVOICING_DB_PASSWORD:-password}
    ports:
      - "${INVOICING_DB_PORT:-27017}:27017"

  # --- Investment Service ---
  investment-service:
    build:
      context: ../vankoo-investment-service
      dockerfile: Dockerfile
    hostname: investment-service
    networks:
      - main-network
    # En producción, no se debería exponer el puerto del Investment directamente al exterior, pero
    # para desarrollo es útil para hacer pruebas manuales con Postman o el navegador.
    ports:
      # El puerto de la izquierda es el de tu PC, el de la derecha es el del contenedor.
      # 8082 es el mismo que el servicio declara en su server.port, para que responda en
      # el mismo sitio dentro y fuera de Docker. Antes publicaba el 8083, que es el de
      # finance-service: cualquiera que levantase los dos se llevaba un address already
      # in use, y la tarjeta que pide publicar Finance en el 8083 era imposible.
      - "${INVESTMENT_SERVICE_PORT:-8082}:8082"
    environment:
      INVESTMENT_SERVICE_HOST: ${INVESTMENT_SERVICE_HOST:-investment-service}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_DAYS: ${JWT_EXPIRATION_DAYS}
      INVESTMENT_DB_HOST: ${INVESTMENT_DB_HOST:-investment-db-oracle} # Usamos el nombre del servicio de la base de datos como hostname para la conexión
      INVESTMENT_DB_PORT: ${INVESTMENT_DB_PORT:-1521}
      INVESTMENT_DB_USER: ${INVESTMENT_DB_USER:-VANKOO_INVESTMENT}
      INVESTMENT_DB_PASSWORD: ${INVESTMENT_DB_PASSWORD:-password}
      KAFKA_HOST: ${KAFKA_HOST:-kafka-broker}
      KAFKA_INTERNAL_PORT: ${KAFKA_INTERNAL_PORT:-9094}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL:-http://discovery-server:8761/eureka/}
    depends_on:
      investment-db-oracle:
        condition: service_started # La imagen de Oracle no define healthcheck propio
      kafka-broker:
        condition: service_healthy # Espera a que el broker acepte mensajes
      discovery-server:
        condition: service_healthy # Espera a que Eureka esté listo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health/readiness" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # --- Investment Database (Oracle) ---
  investment-db-oracle:
    # Usamos la imagen de gvenzl/oracle-free que es una libre de Oracle Database,
    # ya que la imagen oficial de Oracle no es gratuita ni fácil de usar en entornos de desarrollo.
    # Usamos "23" por ser la "23c" de Oracle, "slim" para una imagen más ligera y "faststart" para optimizar el tiempo de arranque.
    image: gvenzl/oracle-free:23-slim-faststart
    networks:
      - main-network
    volumes:
      - investment-db-data:/opt/oracle/oradata
    ports:
      - "${INVESTMENT_DB_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${INVESTMENT_DB_MASTER_PASSWORD:-password} # El password para el admin (SYS)
      APP_USER: ${INVESTMENT_DB_USER:-VANKOO_INVESTMENT} # El usuario que usará el Investment Service para conectarse a la base de datos
      APP_USER_PASSWORD: ${INVESTMENT_DB_PASSWORD:-password} # La contraseña para el usuario de la aplicación

  # --- Finance Service ---
  # El servicio y su infraestructura: la base de datos del Read Model y Axon Server,
  # que es el Event Store (guarda los eventos de dominio, no es una base de datos
  # tradicional). Ver docs/adr/0001 y 0002 en vankoo-finance-service.
  finance-service:
    build:
      context: ../vankoo-finance-service
      dockerfile: Dockerfile
    hostname: finance-service
    networks:
      - main-network
    # El 8083 se publica a propósito aunque el gateway ya rutee a Finance: el webhook
    # de Stripe (/api/v1/payment-providers/stripe/webhooks) no pasa por el gateway
    # (Stripe no manda JWT), y `stripe listen --forward-to localhost:8083/...` lo
    # necesita. La app del inversionista también le pega directo por ahora.
    ports:
      - "${FINANCE_SERVICE_PORT:-8083}:8083" # El puerto de la izquierda es el de tu PC, el de la derecha es el del contenedor
    environment:
      FINANCE_SERVICE_HOST: ${FINANCE_SERVICE_HOST:-finance-service}
      FINANCE_DB_HOST: ${FINANCE_DB_HOST:-finance-db-postgres} # Usamos el nombre del servicio de la base de datos como hostname para la conexión
      # Fijo, NO ${FINANCE_DB_PORT}: esa variable es el puerto en tu PC (5434, porque
      # 5432 y 5433 ya los usan IAM y Profile). Dentro de la red Postgres escucha en 5432.
      FINANCE_DB_PORT: 5432
      FINANCE_DB_NAME: ${FINANCE_DB_NAME:-vankoo_finance_db_dev}
      FINANCE_DB_USERNAME: ${FINANCE_DB_USERNAME:-admin}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:-password}
      FINANCE_DOCUMENTATION_SERVER_URL: ${FINANCE_DOCUMENTATION_SERVER_URL:-localhost} # URL para el servidor de documentación
      FINANCE_DOCUMENTATION_GATEWAY_URL: ${FINANCE_DOCUMENTATION_GATEWAY_URL:-localhost} # URL para el API Gateway en la documentación
      KAFKA_HOST: ${KAFKA_HOST:-kafka-broker}
      KAFKA_INTERNAL_PORT: ${KAFKA_INTERNAL_PORT:-9094}
      AXON_SERVER_HOST: ${AXON_SERVER_HOST:-axon-server}
      # Fijo por la misma razón que FINANCE_DB_PORT: AXON_SERVER_GRPC_PORT es el puerto
      # publicado en tu PC; dentro de la red Axon Server escucha gRPC en 8124.
      AXON_SERVER_PORT: 8124
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL:-http://discovery-server:8761/eureka/}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-8080} # Usada principalmente para la URL de la documentación de OpenAPI
      # Stripe. El servicio arranca con las claves vacías; fallan solo la creación de
      # depósitos y la verificación de webhooks. Las de test van en tu .env (ignorado
      # por git), nunca aquí ni en .env.example. Ver docs/guides/stripe-configuration.md
      # en vankoo-finance-service.
      STRIPE_ENABLED: ${STRIPE_ENABLED:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # A dónde vuelve el inversionista tras el Checkout. Esquema propio de la app
      # móvil, verificado en un teléfono real: Chrome vuelve solo a la app.
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-vankoo://deposits/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-vankoo://deposits/cancel}
    depends_on:
      finance-db-postgres:
        condition: service_healthy # Flyway migra al arrancar; necesita la DB aceptando conexiones
      axon-server:
        condition: service_healthy # Sin el contexto "default" listo, Axon Framework falla al conectar
      kafka-broker:
        condition: service_healthy # Espera a que el broker acepte mensajes
      discovery-server:
        condition: service_healthy # Espera a que Eureka esté listo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health/readiness" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s # Flyway + conexión a Axon Server + Kafka: tarda más que IAM
    restart: unless-stopped

  finance-db-postgres:
    image: postgres:15
    networks:
      - main-network
    volumes:
      - finance-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${FINANCE_DB_NAME:-vankoo_finance_db_dev}
      POSTGRES_USER: ${FINANCE_DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:-password}
    ports:
      - "${FINANCE_DB_PORT:-5434}:5432" # 5434 en tu PC porque 5432 y 5433 ya los usan IAM y Profile
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  axon-server:
    # Axon Server es el Event Store: donde se guardan los eventos de dominio
    # (no reemplaza a Postgres, que sigue siendo el Read Model de consultas).
    image: axoniq/axonserver:latest
    hostname: axon-server
    networks:
      - main-network
    environment:
      # SIN esta variable, Axon Server arranca "vacío": no crea ningún contexto,
      # y el finance-service falla al conectarse con un error NOT_FOUND porque
      # ni siquiera existe el contexto "default". Lo verificamos a mano antes de
      # agregarlo acá — sin esto, este servicio no sirve de nada.
      AXONIQ_AXONSERVER_STANDALONE: true
    volumes:
      - axonserver-data:/axonserver/data # Metadatos: contextos, aplicaciones registradas, etc.
      - axonserver-events:/axonserver/events # Los eventos de dominio en sí (esto es el Event Store real)
      - axonserver-log:/axonserver/log # Log de replicación interno de Axon Server
    ports:
      - "${AXON_SERVER_HTTP_PORT:-8024}:8024" # Consola web + API REST: http://localhost:8024
      - "${AXON_SERVER_GRPC_PORT:-8124}:8124" # Puerto por el que se conecta finance-service (gRPC)
      # No exponemos el 8224: es el puerto de clustering interno, y la edición
      # gratuita de Axon Server no permite más de un nodo (ver docs/adr/0002).
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8024/actuator/health/readiness" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s # Axon Server tarda un poco en inicializar el contexto la primera vez

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z # Usamos una versión específica para asegurar estabilidad
    networks:
      - main-network
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9100}:9000" # Puerto para la API (S3)
      - "${MINIO_CONSOLE_PORT:-9101}:9001" # Puerto para la Consola Web, el de la izquierda es para tu Pc, el de la derecha es para el contenedor

  # --- CORREO DE DESARROLLO (MAILPIT) ---
  # Un servidor SMTP de mentira: acepta todo lo que le manden y lo enseña en una
  # bandeja web en vez de entregarlo a nadie. El iam-service habla el mismo SMTP que
  # hablaría con un proveedor real, así que el código es idéntico en local y en
  # producción; lo único que cambia son MAIL_HOST y MAIL_PORT.
  mailpit:
    image: axllent/mailpit:v1.27 # Versión fija, como el resto de imágenes
    hostname: mailpit
    networks:
      - main-network
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP: a donde apunta spring.mail.port del IAM
      - "${MAILPIT_UI_PORT:-8025}:8025" # Bandeja web: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: true # En local no queremos credenciales
      MP_SMTP_AUTH_ALLOW_INSECURE: true # Ni STARTTLS
      MP_MAX_MESSAGES: 500 # Se queda con los últimos 500 y descarta el resto
    # Sin volumen a propósito: perder la bandeja al reiniciar es justo lo que se quiere
    # de un buzón de pruebas.
    healthcheck:
      # La imagen no trae curl ni wget; el propio binario responde si está listo.
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- MENSAJERÍA (KAFKA) ---
  kafka-broker:
    image: apache/kafka:4.1.1
    networks:
      - main-network
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Configuración de Red (Listeners)
      # 9092: Tu PC | 9094: Microservicios | 9093: Gestión interna
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka-broker:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Configuración KRaft (Sin Zookeeper)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Identificador único del cluster (Obligatorio en Apache)
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-vankoo-dev-cluster-2026}

      # Optimización para Desarrollo
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      # Usamos el script oficial de Kafka para pedir su propia versión de API
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${KAFKA_EXTERNAL_PORT:-9092}" ]
      interval: 10s
      timeout: 10s # Kafka a veces tarda en responder el primer handshake
      retries: 5
      start_period: 15s # Le damos un respiro antes de empezar a juzgarlo

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    networks:
      - main-network
    ports:
      - "${KAFKA_UI_PORT:-9000}:8080" #El puerto de la izquierda es el de tu PC, el de la derecha es el del contenedor
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME:-vankoo-dev-cluster}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9094
    depends_on:
      - kafka-broker

  # --- DISCOVERY SERVER (Eureka) ---
  discovery-server:
    build:
      context: ../vankoo-discovery-server
      dockerfile: Dockerfile
    hostname: discovery-server
    networks:
      - main-network
    ports:
      - "${DISCOVERY_SERVER_PORT:-8761}:8761"
    healthcheck: # Sirve para que Docker pueda verificar si el servicio está listo para recibir tráfico. Es especialmente útil para servicios que tardan en arrancar, como los basados en Java.
      # Apuntamos al endpoint específico de readiness
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health/readiness" ] # Usamos el endpoint de readiness para asegurarnos de que el servicio no solo esté "vivo" sino también listo para manejar solicitudes
      interval: 30s # Frecuencia con la que Docker realizará el health-check
      timeout: 10s # Tiempo máximo que Docker esperará para recibir una respuesta antes de considerar el health-check como fallido
      retries: 3 # Número de intentos fallidos antes de marcar el contenedor como no saludable
      start_period: 20s # Tiempo de espera inicial para que el servicio arranque antes de comenzar a hacer health-checks
    restart: unless-stopped # Política de reinicio para asegurar que el servicio se mantenga activo incluso si falla

  # --- API Gateway (Spring Cloud Gateway) ---
  api-gateway:
    build:
      context: ../vankoo-api-gateway
      dockerfile: Dockerfile
    hostname: api-gateway
    networks:
      - main-network
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL:-http://discovery-server:8761/eureka/}
    depends_on:
      discovery-server:
        condition: service_healthy # Espera a que Eureka esté listo antes de arrancar el API Gateway
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness" ] # Verifica que el API Gateway esté listo para recibir tráfico
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

# --- Definición de Redes y Volúmenes ---
networks:
  main-network:
    name: main-network
    driver: bridge

volumes:
  iam-db-data:
  invoicing-db-data:
  investment-db-data:
  finance-db-data:
  axonserver-data:
  axonserver-events:
  axonserver-log:
  profile-db-data:
  minio-data:
  kafka-data:
    driver: local
