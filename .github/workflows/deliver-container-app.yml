# Entrega continua de un microservicio en Azure Container Apps.
#
# Workflow reutilizable: cada servicio lo llama desde su propio pipeline cuando
# su CI ya pasó. Construye y escanea la imagen, la publica en el registro (ACR) y la
# despliega en su Container App del ambiente de desarrollo.
#
# Uso desde el repo del servicio:
#
#   deliver:
#     needs: [build-test]
#     if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
#     permissions:
#       contents: read
#       id-token: write
#     uses: liquilabshq/vankoo-infra/.github/workflows/deliver-container-app.yml@develop
#     with:
#       image: invoicing-service
#       container-app: vankoo-invoicing-service
#       dockerfile: LiquiLabs.Vankoo.Invoicing/Dockerfile
#     secrets: inherit
#
# Autenticación: OIDC contra la identidad administrada vankoo-github-ci, sin
# contraseñas. El repo del servicio solo guarda AZURE_CLIENT_ID,
# AZURE_TENANT_ID y AZURE_SUBSCRIPTION_ID, y Azure acepta el token únicamente
# si viene de la rama develop (publicar) o del environment development
# (desplegar) de ese repo.
#
# La imagen de estas Container Apps la gestiona este workflow: Terraform la
# ignora después de crearlas (ver terraform/apps/main.tf).

name: Deliver container app

on:
  workflow_call:
    inputs:
      image-policy:
        description: Contrato de entrega escaneada. Los callers nuevos pueden exigir scanned-v1.
        required: false
        type: string
        default: scanned-v1
      image:
        description: Nombre de la imagen en el registro (p. ej. invoicing-service).
        required: true
        type: string
      container-app:
        description: Nombre de la Container App que se actualiza.
        required: true
        type: string
      dockerfile:
        description: Ruta del Dockerfile, relativa a la raíz del repo.
        required: false
        type: string
        default: Dockerfile
      context:
        description: Contexto de construcción de la imagen.
        required: false
        type: string
        default: .
      environment:
        description: Environment de GitHub que protege el despliegue.
        required: false
        type: string
        default: development
      registry:
        description: Nombre del Azure Container Registry.
        required: false
        type: string
        default: vankooacrqxv9yb
      resource-group:
        description: Grupo de recursos de Azure.
        required: false
        type: string
        default: liquilabs-vankoo
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
    outputs:
      image-ref:
        description: Referencia completa de la imagen desplegada.
        value: ${{ jobs.publish.outputs.image-ref }}

permissions:
  contents: read

jobs:
  build-scan:
    name: Build and scan image
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.candidate.outputs.image-id }}
      archive-sha: ${{ steps.candidate.outputs.archive-sha }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Validate image policy
        shell: bash
        env:
          IMAGE_POLICY: ${{ inputs.image-policy }}
        run: test "$IMAGE_POLICY" = scanned-v1

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build local candidate (without publishing)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: vankoo-security-candidate:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Save candidate and record its identity
        id: candidate
        shell: bash
        env:
          LOCAL_IMAGE: vankoo-security-candidate:${{ github.sha }}
        run: |
          archive="$RUNNER_TEMP/vankoo-image.tar"
          image_id="$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker image save --output "$archive" "$image_id"
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          echo "archive-sha=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "artifact-name=scanned-image-$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
          printf '{}\n' > "$RUNNER_TEMP/vankoo-trivy.yaml"
          touch "$RUNNER_TEMP/vankoo-trivy.ignore"

      - name: Scan the candidate archive
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: ${{ runner.temp }}/vankoo-trivy.ignore
        with:
          scan-type: image
          input: ${{ runner.temp }}/vankoo-image.tar
          trivy-config: ${{ runner.temp }}/vankoo-trivy.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'

      - name: Upload the approved archive
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: ${{ runner.temp }}/vankoo-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish approved image
    needs: build-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      image-ref: ${{ steps.publish-approved.outputs.image-ref }}
    steps:
      - name: Download the approved archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/approved-image
          merge-multiple: true

      - name: Verify the archive hash and load the approved image
        shell: bash
        env:
          ARCHIVE_SHA: ${{ needs.build-scan.outputs.archive-sha }}
          IMAGE_ID: ${{ needs.build-scan.outputs.image-id }}
        run: |
          archive="$RUNNER_TEMP/approved-image/vankoo-image.tar"
          [[ "$ARCHIVE_SHA" =~ ^[a-f0-9]{64}$ && "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "$ARCHIVE_SHA  $archive" | sha256sum --check
          docker image load --input "$archive"
          [[ "$(docker image inspect --format '{{.Id}}' "$IMAGE_ID")" == "$IMAGE_ID" ]]

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Registry login
        env:
          REGISTRY: ${{ inputs.registry }}
        run: az acr login --name "$REGISTRY"

      - name: Publish approved image and capture its immutable digest
        id: publish-approved
        shell: bash
        env:
          IMAGE_ID: ${{ needs.build-scan.outputs.image-id }}
          REPOSITORY: ${{ inputs.registry }}.azurecr.io/${{ inputs.image }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          sha_tag="$REPOSITORY:${GITHUB_SHA::7}"
          env_tag="$REPOSITORY:$ENVIRONMENT"
          docker tag "$IMAGE_ID" "$sha_tag"
          docker tag "$IMAGE_ID" "$env_tag"
          push_log="$(mktemp)"
          trap 'rm -f "$push_log"' EXIT
          docker push --platform linux/amd64 "$sha_tag" | tee "$push_log"
          digest="$(sed -nE 's/^[^[:space:]]+: digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p' "$push_log")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Cannot identify the immutable digest for the scanned image."
            exit 1
          fi
          image_ref="$REPOSITORY@$digest"
          remote_id="$(docker manifest inspect "$image_ref" | jq -er '.config.digest')"
          if [[ "$remote_id" != "$IMAGE_ID" ]]; then
            echo "::error::The published manifest does not match the scanned image ID."
            exit 1
          fi
          docker push --platform linux/amd64 "$env_tag"
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DEPLOY_IMAGE: ${{ steps.publish-approved.outputs.image-ref }}
        run: echo "Imagen escaneada y publicada → \`$DEPLOY_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: ${{ inputs.environment }}
    # Un despliegue por app a la vez; el siguiente espera en lugar de cancelar.
    concurrency:
      group: deploy-${{ inputs.container-app }}
      cancel-in-progress: false
    env:
      APP: ${{ inputs.container-app }}
      RG: ${{ inputs.resource-group }}
      IMAGE: ${{ needs.publish.outputs.image-ref }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # Solo cambia la imagen: secretos, variables y escalado siguen siendo los
      # que definió Terraform. Cada cambio crea una revisión nueva.
      - name: Update container app
        id: update
        run: |
          revision="$(az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" \
            --only-show-errors --query properties.latestRevisionName -o tsv)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Revisión creada: $revision"

      # Quality gate del despliegue: la revisión nueva tiene que arrancar y
      # pasar sus sondas. Si no lo consigue, el job falla; en modo de revisión
      # única el tráfico sigue en la revisión anterior hasta que la nueva esté
      # lista, así que un despliegue roto no deja el servicio caído.
      - name: Wait for a healthy revision
        env:
          REVISION: ${{ steps.update.outputs.revision }}
        run: |
          for attempt in $(seq 1 40); do
            read -r provisioning running health < <(az containerapp revision show \
              -n "$APP" -g "$RG" --revision "$REVISION" --only-show-errors \
              --query "{p:properties.provisioningState, r:properties.runningState, h:properties.healthState}" -o tsv)
            echo "[$attempt/40] provisioning=$provisioning running=$running health=$health"

            if [[ "$provisioning" == "Failed" || "$running" == "Failed" || "$running" == "Degraded" ]]; then
              echo "::error::La revisión $REVISION no arrancó ($provisioning / $running)."
              exit 1
            fi
            if [[ "$provisioning" == "Provisioned" && "$health" == "Healthy" && "$running" == Running* ]]; then
              echo "La revisión $REVISION está sana."
              exit 0
            fi
            sleep 15
          done
          echo "::error::La revisión $REVISION no quedó sana en 10 minutos."
          exit 1

      - name: Summary
        env:
          REVISION: ${{ steps.update.outputs.revision }}
        run: |
          {
            echo "### Despliegue en ${{ inputs.environment }}"
            echo "| Container App | Imagen | Revisión |"
            echo "| --- | --- | --- |"
            echo "| \`$APP\` | \`$IMAGE\` | \`$REVISION\` |"
          } >> "$GITHUB_STEP_SUMMARY"
