services:
  # --- Bases de datos ---
  postgres-iam:
    image: postgres:15 # Versión 15 estable
    networks:
      - vankoo-network
    volumes:
      - postgres_iam_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${IAM_DB_NAME:-vankoo_iam_db_dev}
      POSTGRES_USER: ${IAM_DB_USER:-admin}
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:-password} # Usa variable o 'password' por defecto
    ports:
      - "${IAM_DB_PORT:-5432}:5432"

  mongodb-invoice:
    image: mongo:7.0
    networks:
      - vankoo-network
    volumes:
      - mongo_invoice_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${INVOICE_DB_NAME:-vankoo_invoice_db_dev}
      MONGO_INITDB_ROOT_USERNAME: ${INVOICE_DB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${INVOICE_DB_PASSWORD:-password}
    ports:
      - "${INVOICE_DB_PORT:-27017}:27017"

  redis-finance:
    image: redis:7.4.7-alpine
    networks:
      - vankoo-network
    volumes:
      - redis_finance_data:/data
    ports:
      - "${FINANCE_REDIS_PORT:-6379}:6379"

  # --- MENSAJERÍA (KAFKA) ---
  kafka:
    image: apache/kafka:4.1.1
    networks:
      - vankoo-network
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Configuración de Red (Listeners)
      # 9092: Tu PC | 9094: Microservicios | 9093: Gestión interna
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Configuración KRaft (Sin Zookeeper)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Identificador único del cluster (Obligatorio en Apache)
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-vankoo-dev-cluster-2026}

      # Optimización para Desarrollo
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    networks:
      - vankoo-network
    ports:
      - "${KAFKA_UI_PORT:-9000}:8080" #El puerto de la izquierda es el de tu PC, el de la derecha es el del contenedor
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME:-vankoo-dev-cluster}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      - kafka

  # --- DISCOVERY SERVER (Eureka) ---
  # Una vez que lo programen, lo pondrán aquí para que se levante solo

# --- Definición de Redes y Volúmenes ---
networks:
  vankoo-network:
    name: vankoo-network
    driver: bridge

volumes:
  postgres_iam_data:
  mongo_invoice_data:
  redis_finance_data: